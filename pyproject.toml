[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ast-semantic-diff-pruner"
version = "0.1.0"
description = "Tree-aware code diff pruning and AST node attribution to minimize token consumption in coding agent prompts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
ast-semantic-diff-pruner = "ast_semantic_diff_pruner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ast_semantic_diff_pruner*"]
